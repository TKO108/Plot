<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChronoPlot">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>ChronoPlot - 近未来プロット＆エモーション可視化ツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- html2canvas & jsPDF (直接PDF生成＆横向き・複数枚分割制御用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#060913',
                            panel: '#0d1326',
                            card: '#131c36',
                            border: '#1e2d52',
                            cyan: '#00f0ff',
                            pink: '#ff007f',
                            purple: '#9d4edd',
                            emerald: '#00f59b',
                            amber: '#ffb703'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 12px rgba(0, 240, 255, 0.45), inset 0 0 6px rgba(0, 240, 255, 0.2)',
                        'neon-pink': '0 0 12px rgba(255, 0, 127, 0.45), inset 0 0 6px rgba(255, 0, 127, 0.2)',
                        'neon-purple': '0 0 12px rgba(157, 78, 221, 0.45)',
                    }
                }
            }
        }
    </script>

    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.25);
        }

        /* 白紙キャンバスのグリッド背景 */
        .canvas-grid-dark {
            background-color: #060913;
            background-image:
                linear-gradient(to right, rgba(0, 240, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .canvas-grid-light {
            background-color: #f8fafc;
            background-image:
                linear-gradient(to right, rgba(15, 23, 42, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* 接続線のアニメーション */
        @keyframes dashFlow {
            to {
                stroke-dashoffset: -24;
            }
        }
        .connection-line-anim {
            stroke-dasharray: 6 6;
            animation: dashFlow 1.2s linear infinite;
        }

        /* 付箋のドラッグ・選択トランジション */
        .sticky-node {
            transition: box-shadow 0.2s ease, transform 0.1s ease;
            user-select: none;
            touch-action: none;
        }
        .sticky-node:active {
            cursor: grabbing;
        }
        .sticky-selected {
            box-shadow: 0 0 0 3px #00f0ff, 0 12px 24px rgba(0, 240, 255, 0.35) !important;
            transform: translateY(-2px);
        }

        /* レンジスライダーのカスタマイズ */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 999px;
            background: #334155;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00f0ff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-cyber-bg dark:text-slate-100 font-sans antialiased overflow-hidden h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- ==================== 1. トップヘッダー ==================== -->
    <header class="h-14 border-b border-slate-300 dark:border-cyber-border bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md px-4 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-3">
            <!-- ホームへ戻るボタン（ワークスペース表示時のみ表示） -->
            <button id="btn-back-home" onclick="app.goHome()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-cyan-300 transition">
                <i class="ph ph-folder-open text-base"></i>
                <span>物語一覧</span>
            </button>

            <!-- ロゴ -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.goHome()">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center text-white shadow-neon-cyan">
                    <i class="ph-bold ph-graph text-lg"></i>
                </div>
                <span class="font-mono font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-500 to-fuchsia-500 dark:from-cyber-cyan dark:to-cyber-pink">
                    ChronoPlot
                </span>
            </div>

            <!-- 現在の物語タイトル表示（ワークスペース表示時のみ表示・クリックで編集可能） -->
            <div id="header-story-title-wrap" onclick="app.openEditStoryModal()" class="hidden items-center gap-2 pl-3 border-l border-slate-300 dark:border-slate-700 cursor-pointer group" title="クリックして物語の名前・メモを編集">
                <span class="text-xs text-slate-400">PROJECT:</span>
                <span id="header-story-title" class="font-bold text-sm truncate max-w-[240px] group-hover:text-cyan-500 dark:group-hover:text-cyber-cyan transition">無題の物語</span>
                <i class="ph-bold ph-pencil-simple text-xs text-slate-400 group-hover:text-cyan-500 transition"></i>
            </div>
        </div>

        <!-- 右側アクション（PDF出力・テーマ切替） -->
        <div class="flex items-center gap-2">
            <button id="btn-export-pdf" onclick="app.openPdfExportModal()" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl border border-fuchsia-500/40 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 text-fuchsia-600 dark:text-cyber-pink text-xs font-bold transition shadow-sm" title="物語の設定とプロットをPDF出力">
                <i class="ph-bold ph-file-pdf text-base"></i>
                <span>PDF出力</span>
            </button>

            <button onclick="app.toggleTheme()" id="btn-theme-toggle" class="p-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 hover:border-cyan-400 transition flex items-center gap-1.5 text-xs font-medium" title="ダーク / ライトモード切替">
                <i id="theme-icon" class="ph-fill ph-moon-stars text-base text-cyan-400"></i>
                <span id="theme-label" class="hidden sm:inline">NEON DARK</span>
            </button>
        </div>
    </header>

    <!-- ==================== 2. ホーム画面（物語フォルダ一覧） ==================== -->
    <main id="view-home" class="flex-1 overflow-y-auto p-6 md:p-10">
        <div class="max-w-5xl mx-auto">
            <!-- ヒーローセクション -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-300 dark:border-slate-800">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight flex items-center gap-2.5">
                        <i class="ph-duotone ph-folders text-cyan-500 dark:text-cyber-cyan text-3xl"></i>
                        <span>物語プロジェクト一覧</span>
                    </h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                        付箋でプロットを組み立て、感情の起伏（エモーションレベル）を直感的に可視化します。
                    </p>
                </div>
                <button onclick="app.openCreateStoryModal()" class="px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm shadow-neon-cyan flex items-center justify-center gap-2 transition transform hover:-translate-y-0.5 shrink-0">
                    <i class="ph-bold ph-folder-plus text-lg"></i>
                    <span>新しい物語を作成</span>
                </button>
            </div>

            <!-- 物語フォルダグリッド -->
            <div id="story-folder-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- JSで動的生成 -->
            </div>
        </div>
    </main>

    <!-- ==================== 3. ワークスペース画面（フォルダ内） ==================== -->
    <div id="view-workspace" class="hidden flex-1 flex overflow-hidden relative">

        <!-- 3-1. 左サイドナビゲーションバー -->
        <aside class="w-16 sm:w-20 border-r border-slate-300 dark:border-slate-800 bg-white dark:bg-cyber-panel flex flex-col items-center py-4 gap-3 z-30 shrink-0">
            <button onclick="app.toggleDrawer('template')" id="nav-template" class="nav-btn group w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                <i class="ph-duotone ph-blueprint text-2xl group-hover:text-amber-500 dark:group-hover:text-cyber-amber"></i>
                <span class="text-[9px] font-bold leading-tight text-center">簡易<br class="sm:hidden">テンプレ</span>
            </button>

            <button onclick="app.toggleDrawer('world')" id="nav-world" class="nav-btn group w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                <i class="ph-duotone ph-planet text-2xl group-hover:text-cyan-500 dark:group-hover:text-cyber-cyan"></i>
                <span class="text-[10px] font-bold">舞台設定</span>
            </button>

            <button onclick="app.toggleDrawer('characters')" id="nav-characters" class="nav-btn group w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                <i class="ph-duotone ph-users-three text-2xl group-hover:text-pink-500 dark:group-hover:text-cyber-pink"></i>
                <span class="text-[10px] font-bold">キャラ設定</span>
            </button>

            <button onclick="app.toggleDrawer('stickies')" id="nav-stickies" class="nav-btn group w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                <i class="ph-duotone ph-note-pencil text-2xl group-hover:text-emerald-500 dark:group-hover:text-cyber-emerald"></i>
                <span class="text-[10px] font-bold">付箋作成</span>
            </button>

            <div class="w-8 h-[1px] bg-slate-300 dark:bg-slate-800 my-1"></div>

            <button onclick="app.toggleConnectMode()" id="nav-connect" class="group w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
                <i class="ph-duotone ph-share-network text-2xl group-hover:text-amber-500 dark:group-hover:text-cyber-amber"></i>
                <span class="text-[10px] font-bold">付箋つなぎ</span>
            </button>

            <div class="mt-auto">
                <button onclick="app.toggleGraphPanel()" id="nav-graph-toggle" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex flex-col items-center justify-center gap-1 bg-cyan-500/10 text-cyan-600 dark:text-cyber-cyan border border-cyan-500/30 transition" title="エモーショングラフ表示切替">
                    <i class="ph-duotone ph-chart-line-up text-2xl"></i>
                    <span class="text-[9px] font-bold">感情グラフ</span>
                </button>
            </div>
        </aside>

        <!-- 3-2. スライドドロワーパネル（簡易テンプレ / 舞台設定 / キャラ設定 / 付箋作成） -->
        <section id="side-drawer" class="hidden w-80 sm:w-96 border-r border-slate-300 dark:border-slate-800 bg-white/95 dark:bg-cyber-panel/95 backdrop-blur-xl flex flex-col z-20 shrink-0 shadow-2xl">
            <div class="px-4 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h2 id="drawer-title" class="font-bold text-sm flex items-center gap-2">設定</h2>
                <button onclick="app.closeDrawer()" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400">
                    <i class="ph-bold ph-x text-base"></i>
                </button>
            </div>
            <div id="drawer-content" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- JSで各パネルを描画 -->
            </div>
        </section>

        <!-- 3-3. メインエリア（白紙キャンバス ＋ エモーションレベルグラフ） -->
        <div class="flex-1 flex flex-col overflow-hidden relative">

            <!-- キャンバス上部ツールバー（モード切替・Undo/Redo・整列・視点リセット） -->
            <div class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
                <!-- 左側：モード切替 ＆ Undo / Redo -->
                <div class="pointer-events-auto flex flex-wrap items-center gap-1.5 bg-white/90 dark:bg-cyber-panel/90 backdrop-blur px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 shadow-lg">
                    <button id="btn-mode-normal" onclick="app.setCanvasMode('normal')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition bg-cyan-500 text-slate-950" title="白紙の移動や付箋のドラッグ移動モード">
                        <i class="ph-bold ph-hand-grabbing"></i> <span>移動</span>
                    </button>
                    <button id="btn-mode-select" onclick="app.setCanvasMode('select')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800" title="付箋をドラッグ囲み・タップで複数選択">
                        <i class="ph-bold ph-selection-plus"></i> <span>複数選択</span>
                    </button>
                    <button id="btn-clear-selection" onclick="app.clearSelection()" class="hidden px-2 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 bg-rose-500/15 hover:bg-rose-500/25 text-rose-500 border border-rose-500/30 transition" title="選択状態を解除">
                        <i class="ph-bold ph-x-circle"></i> <span>解除 (<span id="selected-count">0</span>)</span>
                    </button>

                    <div class="w-[1px] h-4 bg-slate-300 dark:bg-slate-700 mx-0.5"></div>

                    <!-- Undo / Redo ボタン -->
                    <button id="btn-undo" onclick="app.undo()" disabled class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1 text-xs font-bold" title="元に戻す (Ctrl+Z)">
                        <i class="ph-bold ph-arrow-u-up-left text-sm"></i> <span class="hidden md:inline">戻す</span>
                    </button>
                    <button id="btn-redo" onclick="app.redo()" disabled class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1 text-xs font-bold" title="やり直す (Ctrl+Y)">
                        <i class="ph-bold ph-arrow-u-up-right text-sm"></i> <span class="hidden md:inline">やり直し</span>
                    </button>

                    <!-- 付箋つなぎモード中のガイド -->
                    <div id="connect-mode-banner" class="hidden items-center gap-2 pl-2 border-l border-amber-500/40 text-amber-600 dark:text-cyber-amber text-xs font-bold">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                        <span id="connect-guide-text">1枚目の付箋を選択</span>
                        <button onclick="app.toggleConnectMode(false)" class="px-1.5 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500/30">終了</button>
                    </div>
                </div>

                <!-- 右側：ズーム表示・階層整列・大きな視点リセットボタン -->
                <div class="pointer-events-auto flex items-center gap-2 bg-white/90 dark:bg-cyber-panel/90 backdrop-blur px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 shadow-lg">
                    <span id="zoom-level-label" class="font-mono font-bold text-xs text-cyan-600 dark:text-cyber-cyan px-1" title="ピンチイン・ピンチアウト（またはCtrl+ホイール）で自由に拡大縮小できます">100%</span>
                    <div class="w-[1px] h-4 bg-slate-300 dark:bg-slate-700"></div>
                    <button onclick="app.autoAlignCanvas()" class="px-2.5 py-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-xs font-bold flex items-center gap-1 text-slate-700 dark:text-slate-200" title="大筋を最上段、キャラナンバー順に階層整列">
                        <i class="ph-bold ph-magic-wand text-cyan-500"></i> <span class="hidden sm:inline">番号順に整列</span>
                    </button>
                    <button onclick="app.resetCanvasScroll()" class="px-3.5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 dark:bg-cyber-cyan text-white dark:text-slate-950 font-bold text-xs sm:text-sm shadow-neon-cyan flex items-center gap-1.5 transition" title="付箋がある基準位置へ視点を戻す">
                        <i class="ph-bold ph-crosshair text-base"></i> <span>視点リセット</span>
                    </button>
                </div>
            </div>

            <!-- 白紙キャンバス領域（上下左右無限拡張＆ピンチズーム対応） -->
            <div id="canvas-viewport" class="flex-1 relative overflow-auto canvas-grid-dark cursor-grab active:cursor-grabbing">
                <div id="canvas-zoom-wrapper" style="width: 5000px; height: 5000px; position: relative;">
                    <div id="canvas-board" class="relative origin-top-left" style="width: 5000px; height: 5000px;">
                        <!-- 接続線描画用SVGレイヤー -->
                        <svg id="connections-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0">
                            <defs>
                                <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L9,3 z" fill="#00f0ff" />
                                </marker>
                                <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L9,3 z" fill="#ff007f" />
                                </marker>
                                <marker id="arrow-emerald" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L9,3 z" fill="#00f59b" />
                                </marker>
                                <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L9,3 z" fill="#ffb703" />
                                </marker>
                                <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L9,3 z" fill="#c084fc" />
                                </marker>
                            </defs>
                            <g id="connections-group"></g>
                        </svg>

                        <!-- 範囲選択（マーキー）ボックス -->
                        <div id="selection-marquee" class="hidden absolute border-2 border-cyan-400 bg-cyan-400/15 rounded-lg pointer-events-none z-30"></div>

                        <!-- 付箋配置コンテナ -->
                        <div id="stickies-layer" class="relative z-10 w-full h-full">
                            <!-- JSで付箋カードを描画 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3-4. エモーションレベル可視化グラフパネル -->
            <div id="emotion-graph-panel" class="h-64 sm:h-72 border-t border-slate-300 dark:border-cyber-border bg-white/95 dark:bg-cyber-panel/95 backdrop-blur-md flex flex-col z-20 shrink-0 transition-all duration-300">
                <!-- グラフヘッダー -->
                <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <i class="ph-duotone ph-pulse text-cyan-500 dark:text-cyber-cyan text-lg"></i>
                        <span class="font-bold text-xs sm:text-sm tracking-wide">エモーションレベル推移 (-100 〜 +100)</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <!-- 総合 / 単体（キャラ別・大筋）切替 -->
                        <label for="graph-filter-select" class="text-[11px] text-slate-400 hidden sm:inline">表示対象:</label>
                        <select id="graph-filter-select" onchange="app.renderEmotionGraph()" class="text-xs font-semibold rounded-lg px-2.5 py-1 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-cyan-500">
                            <option value="all">総合（すべて表示）</option>
                            <option value="main">単体：大筋のみ</option>
                        </select>

                        <button onclick="app.toggleGraphPanel(false)" class="p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400" title="グラフを隠す">
                            <i class="ph-bold ph-caret-down"></i>

                </div>

                <!-- グラフ描画エリア -->
                <div id="emotion-graph-container" class="flex-1 relative px-2 py-1 overflow-hidden flex items-center justify-center">
                    <!-- JSでSVG折れ線グラフを描画 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JavaScript アプリケーション本体 ==================== -->
    <script>
        class ChronoPlotApp {

                    emerald: { id: 'emerald', name: 'エメラルド', hex: '#00f59b', bgDark: 'rgba(0, 245, 155, 0.14)', borderDark: 'rgba(0, 245, 155, 0.65)', marker: 'url(#arrow-emerald)' },

                    stories: [],
                    currentStoryId: null,
                    activeDrawer: null,
                    selectedCharId: null,
                    stickyFolderFilter: 'all',

                    connectSourceId: null,

                    zoom: 1.0,
                    boardWidth: 5000,
                    boardHeight: 5000,

                    pendingMainColorHex: null,

                this.dragInfo = {
                    isDragging: false,
                    items: [],
                    startMouseX: 0,
                    startMouseY: 0,
                    moved: false

                this.marqueeInfo = {
                    isSelecting: false,

                    startY: 0

            // ==================== 初期化・データ管理 ====================
            init() {
                this.loadData();
                if (this.state.stories.length === 0) {

                        this.renderEmotionGraph();
                    }
                });
            }

            loadData() {
                try {
                    const raw = localStorage.getItem(this.STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            this.state.stories = parsed;
                        }
                    }
                } catch (e) {
                    console.warn('データの読み込みに失敗しました:', e);

            saveData() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state.stories));

                            { id: 'ws_2', title: '種族・技術', content: '人間と自律思考型アンドロイド「機人」が共存。記憶を結晶化する「メモリア技術」が存在する。' },
                            { id: 'ws_3', title: '物語の成り立ち', content: '100年前の大崩落以来、外の世界との連絡が途絶え、都市のエネルギー残量が限界を迎えつつある。' }

                        stickies: [

                            { id: 'st_2', number: 2, targetType: 'main', targetId: 'main', emotion: 45, content: '運命の出会い：墜落現場で眠っていた機人カインとルナが共鳴する。', placed: true, x: ox + 340, y: oy + 90 },
                            { id: 'st_3', number: 3, targetType: 'main', targetId: 'main', emotion: -75, content: '絶望の真相：都市の維持にはルナ自身の記憶結晶が必要だと判明する。', placed: true, x: ox + 620, y: oy + 90 },
                            { id: 'st_4', number: 4, targetType: 'main', targetId: 'main', emotion: 90, content: '希望の選択：仲間と共に新たなエネルギー源を起動し、空へ旅立つ。', placed: true, x: ox + 900, y: oy + 90 },
                            { id: 'st_5', number: 1, targetType: 'character', targetId: char1Id, emotion: -20, content: '自分の過去が分からず孤独を感じながらも、人々を助けようと奔走する。', placed: true, x: ox + 60, y: oy + 320 },
                            { id: 'st_6', number: 2, targetType: 'character', targetId: char1Id, emotion: 65, content: 'カインに背中を押され、自分の意志で運命を切り開く覚悟を決める。', placed: true, x: ox + 340, y: oy + 320 },
                            { id: 'st_7', number: 1, targetType: 'character', targetId: char2Id, emotion: 0, content: '命令通りルナを保護するが、感情プログラムの揺らぎに戸惑う。', placed: true, x: ox + 60, y: oy + 550 },
                            { id: 'st_8', number: 2, targetType: 'character', targetId: char2Id, emotion: -50, content: '機能停止寸前まで傷つきながらも、盾となってルナを守り抜く。', placed: true, x: ox + 340, y: oy + 550 }
                        ],
                        connections: [
                            { id: 'conn_1', from: 'st_1', to: 'st_2' },
                            { id: 'conn_2', from: 'st_2', to: 'st_3' },
                            { id: 'conn_3', from: 'st_3', to: 'st_4' },
                            { id: 'conn_4', from: 'st_5', to: 'st_6' },
                            { id: 'conn_5', from: 'st_7', to: 'st_8' }

                    }
                ];
                this.saveData();
            }

            getCurrentStory() {
                return this.state.stories.find(s => s.id === this.state.currentStoryId) || null;
            }

            // ==================== アンドゥ / リドゥ（履歴管理） ====================
            pushHistory() {
                const story = this.getCurrentStory();
                if (!story) return;
                const snapshot = JSON.stringify({
                    title: story.title,
                    description: story.description,
                    mainColor: story.mainColor || 'cyan',
                    simpleTemplate: story.simpleTemplate || { p: '', s: '', l: '', o: '', c: '' },
                    worldSettings: story.worldSettings,
                    characters: story.characters,
                    stickies: story.stickies,
                    connections: story.connections
                });
                if (this.state.historyPast.length > 0 && this.state.historyPast[this.state.historyPast.length - 1] === snapshot) {
                    return;
                }
                this.state.historyPast.push(snapshot);
                if (this.state.historyPast.length > 40) {
                    this.state.historyPast.shift();
                }
                this.state.historyFuture = [];
                this.updateHistoryButtonsUI();
            }

            undo() {
                const story = this.getCurrentStory();
                if (!story || this.state.historyPast.length === 0) return;

                const currentSnapshot = JSON.stringify({
                    title: story.title,
                    description: story.description,
                    mainColor: story.mainColor || 'cyan',
                    simpleTemplate: story.simpleTemplate || { p: '', s: '', l: '', o: '', c: '' },
                    worldSettings: story.worldSettings,
                    characters: story.characters,
                    stickies: story.stickies,
                    connections: story.connections
                });
                this.state.historyFuture.push(currentSnapshot);

                const prevSnapshot = JSON.parse(this.state.historyPast.pop());
                Object.assign(story, prevSnapshot);
                this.state.selectedStickyIds = [];
                this.state.pendingCharColorHex = null;
                this.state.pendingMainColorHex = null;

                const headerTitle = document.getElementById('header-story-title');
                if (headerTitle) headerTitle.textContent = story.title;

                this.saveData();
                this.updateHistoryButtonsUI();
                this.updateGraphFilterOptions();
                this.renderCanvas();
                this.renderEmotionGraph();
                if (this.state.activeDrawer) this.renderDrawer();
                this.showToast('操作を元に戻しました');
            }

            redo() {
                const story = this.getCurrentStory();
                if (!story || this.state.historyFuture.length === 0) return;

                const currentSnapshot = JSON.stringify({
                    title: story.title,
                    description: story.description,
                    mainColor: story.mainColor || 'cyan',
                    simpleTemplate: story.simpleTemplate || { p: '', s: '', l: '', o: '', c: '' },
                    worldSettings: story.worldSettings,
                    characters: story.characters,
                    stickies: story.stickies,
                    connections: story.connections
                });
                this.state.historyPast.push(currentSnapshot);

                const nextSnapshot = JSON.parse(this.state.historyFuture.pop());
                Object.assign(story, nextSnapshot);
                this.state.selectedStickyIds = [];
                this.state.pendingCharColorHex = null;
                this.state.pendingMainColorHex = null;

                const headerTitle = document.getElementById('header-story-title');
                if (headerTitle) headerTitle.textContent = story.title;

                this.saveData();
                this.updateHistoryButtonsUI();
                this.updateGraphFilterOptions();
                this.renderCanvas();
                this.renderEmotionGraph();
                if (this.state.activeDrawer) this.renderDrawer();
                this.showToast('操作をやり直しました');
            }

            updateHistoryButtonsUI() {
                const undoBtn = document.getElementById('btn-undo');
                const redoBtn = document.getElementById('btn-redo');
                if (undoBtn) undoBtn.disabled = this.state.historyPast.length === 0;
                if (redoBtn) redoBtn.disabled = this.state.historyFuture.length === 0;
            }

            setupKeyboardShortcuts() {
                window.addEventListener('keydown', (e) => {
                    if (!this.state.currentStoryId) return;
                    const tag = e.target.tagName.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) {
                            this.redo();
                        } else {
                            this.undo();
                        }
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        this.redo();
                    }
                });
            }

            // ==================== カラー重複判定・自由選択ヘルパー ====================
            normalizeHex(colorValue) {
                if (!colorValue) return '#00f0ff';
                if (this.COLORS[colorValue]) {
                    return this.COLORS[colorValue].hex.toLowerCase();
                }
                let hex = colorValue.trim().toLowerCase();
                if (!hex.startsWith('#')) hex = '#' + hex;
                if (hex.length === 4) {
                    hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
                }
                return hex;
            }

            getColorMeta(colorValue) {
                if (colorValue && this.COLORS[colorValue]) {
                    return this.COLORS[colorValue];
                }
                const hex = this.normalizeHex(colorValue);
                const r = parseInt(hex.slice(1, 3), 16) || 0;
                const g = parseInt(hex.slice(3, 5), 16) || 240;
                const b = parseInt(hex.slice(5, 7), 16) || 255;
                return {
                    id: hex,
                    name: `カスタム (${hex.toUpperCase()})`,
                    hex: hex,
                    bgDark: `rgba(${r}, ${g}, ${b}, 0.16)`,
                    borderDark: `rgba(${r}, ${g}, ${b}, 0.72)`,
                    marker: null
                };
            }

            isColorInUse(colorValue, exclude = {}) {
                const story = this.getCurrentStory();
                if (!story) return false;
                const targetHex = this.normalizeHex(colorValue);

                if (exclude.type !== 'main') {
                    const mainHex = this.normalizeHex(story.mainColor || 'cyan');
                    if (mainHex === targetHex) return true;
                }

                for (const char of story.characters) {
                    if (exclude.type === 'character' && exclude.id === char.id) continue;
                    if (this.normalizeHex(char.color) === targetHex) {
                        return true;
                    }
                }
                return false;
            }

            getFirstAvailableColorKey() {
                for (const key of Object.keys(this.COLORS)) {
                    if (!this.isColorInUse(key)) {
                        return key;
                    }
                }
                let randHex = '#38bdf8';
                for (let i = 0; i < 30; i++) {
                    const h = Math.floor(Math.random() * 360);
                    randHex = this.hslToHex(h, 85, 60);
                    if (!this.isColorInUse(randHex)) break;
                }
                return randHex;
            }

            hslToHex(h, s, l) {
                l /= 100;
                const a = s * Math.min(l, 1 - l) / 100;
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
            }

            // ==================== 画面遷移（ホーム ⇔ フォルダ内） ====================
            goHome() {
                this.flushTemplateInputs();
                this.saveData();
                this.state.currentStoryId = null;
                this.state.activeDrawer = null;
                this.state.isConnectMode = false;
                this.state.connectSourceId = null;
                this.state.selectedStickyIds = [];
                this.state.historyPast = [];
                this.state.historyFuture = [];

                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-workspace').classList.add('hidden');
                document.getElementById('btn-back-home').classList.add('hidden');
                document.getElementById('btn-back-home').classList.remove('flex');
                document.getElementById('btn-export-pdf').classList.add('hidden');
                document.getElementById('btn-export-pdf').classList.remove('flex');
                const titleWrap = document.getElementById('header-story-title-wrap');
                titleWrap.classList.add('hidden');
                titleWrap.classList.remove('md:flex');
                document.getElementById('side-drawer').classList.add('hidden');

                this.renderHome();
            }

            openStory(storyId) {
                const story = this.state.stories.find(s => s.id === storyId);
                if (!story) return;

                if (!story.mainColor) story.mainColor = 'cyan';
                if (!story.simpleTemplate) {
                    story.simpleTemplate = { p: '', s: '', l: '', o: '', c: '' };
                }

                // キャラクターナンバーの補完
                story.characters.forEach((c, idx) => {
                    if (typeof c.number !== 'number' || isNaN(c.number)) {
                        c.number = idx + 1;
                    }
                });

                // 旧座標データの基準オフセット移行
                const minX = story.stickies.reduce((min, s) => Math.min(min, s.x), Infinity);
                const minY = story.stickies.reduce((min, s) => Math.min(min, s.y), Infinity);
                if (story.stickies.length > 0 && (minX < 800 || minY < 800)) {
                    story.stickies.forEach(s => {
                        s.x += this.BOARD_ORIGIN;
                        s.y += this.BOARD_ORIGIN;
                    });
                }

                this.state.currentStoryId = storyId;
                this.state.activeDrawer = null;
                this.state.selectedCharId = story.characters[0]?.id || null;
                this.state.stickyFolderFilter = 'all';
                this.state.isConnectMode = false;
                this.state.connectSourceId = null;
                this.state.zoom = 1.0;
                this.state.boardWidth = 5000;
                this.state.boardHeight = 5000;
                this.state.canvasMode = 'normal';
                this.state.selectedStickyIds = [];
                this.state.pendingCharColorHex = null;
                this.state.pendingMainColorHex = null;
                this.state.historyPast = [];
                this.state.historyFuture = [];

                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-workspace').classList.remove('hidden');
                document.getElementById('btn-back-home').classList.remove('hidden');
                document.getElementById('btn-back-home').classList.add('flex');
                document.getElementById('btn-export-pdf').classList.remove('hidden');
                document.getElementById('btn-export-pdf').classList.add('flex');
                const titleWrap = document.getElementById('header-story-title-wrap');
                titleWrap.classList.remove('hidden');
                titleWrap.classList.add('md:flex');
                document.getElementById('header-story-title').textContent = story.title;
                document.getElementById('side-drawer').classList.add('hidden');

                this.updateNavHighlight();
                this.updateConnectModeUI();
                this.updateModeButtonsUI();
                this.updateHistoryButtonsUI();
                this.updateGraphFilterOptions();
                this.applyZoom(1.0);
                this.renderCanvas();
                this.renderEmotionGraph();

                requestAnimationFrame(() => {
                    this.resetCanvasScroll(true);
                });
            }

            // ==================== テーマ切替（ダーク / ライト） ====================
            toggleTheme() {
                const html = document.documentElement;
                const viewport = document.getElementById('canvas-viewport');
                const icon = document.getElementById('theme-icon');
                const label = document.getElementById('theme-label');

                if (this.state.theme === 'dark') {
                    this.state.theme = 'light';
                    html.classList.remove('dark');
                    viewport.classList.remove('canvas-grid-dark');
                    viewport.classList.add('canvas-grid-light');
                    icon.className = 'ph-fill ph-sun text-base text-amber-500';
                    label.textContent = 'LIGHT MODE';
                } else {
                    this.state.theme = 'dark';
                    html.classList.add('dark');
                    viewport.classList.remove('canvas-grid-light');
                    viewport.classList.add('canvas-grid-dark');
                    icon.className = 'ph-fill ph-moon-stars text-base text-cyan-400';
                    label.textContent = 'NEON DARK';
                }

                if (this.state.currentStoryId) {
                    this.renderCanvas();
                    this.renderEmotionGraph();
                }
            }

            // ==================== ホーム画面描画＆物語フォルダ作成・編集 ====================
            renderHome() {
                const grid = document.getElementById('story-folder-grid');
                if (this.state.stories.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-16 text-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-800">
                            <i class="ph-duotone ph-folder-dashed text-5xl text-slate-400 mb-3"></i>
                            <p class="text-slate-500 dark:text-slate-400 font-medium">まだ物語フォルダがありません。「新しい物語を作成」から始めましょう。</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = this.state.stories.map(story => {
                    const stickyCount = story.stickies.length;

                this.closeModal();
