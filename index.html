<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChronoPlot - 次世代ストーリー・プロット構築ツール</title>

    <!-- iPhone / iPad ホーム画面アイコン & PWA設定 -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChronoPlot">
    <meta name="theme-color" content="#07080d">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#07080d',
                            panel: '#0f121d',
                            card: '#161b2c',
                            border: '#252d47',
                            cyan: '#38bdf8',
                            pink: '#ec4899',
                            purple: '#9d4edd',
                            indigo: '#6366f1',
                            green: '#00f59b',
                            yellow: '#ffbe0b'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 10px rgba(99, 102, 241, 0.35), 0 0 18px rgba(236, 72, 153, 0.25)',
                        'neon-pink': '0 0 12px rgba(236, 72, 153, 0.38), inset 0 0 6px rgba(236, 72, 153, 0.15)',
                        'neon-purple': '0 0 12px rgba(157, 78, 221, 0.38)',
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-cyber-bg dark:text-slate-100 transition-colors duration-300 overflow-hidden select-none">

    <!-- 通知トースト -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[120] px-4 py-2 rounded-full bg-slate-900/95 dark:bg-cyber-panel/95 text-white border border-purple-400/50 shadow-lg text-xs font-medium flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 translate-y-[-10px]">
        <span class="w-2 h-2 rounded-full bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 animate-pulse"></span>
        <span id="toast-msg">保存しました</span>
    </div>

    <!-- ==========================================
         HOME VIEW（プロジェクトフォルダ一覧）
    =========================================== -->
    <div id="home-view" class="h-screen w-screen flex flex-col overflow-hidden">
        <!-- ヘッダー -->
        <header class="h-16 px-4 md:px-8 border-b border-slate-200 dark:border-cyber-border bg-white/80 dark:bg-cyber-panel/80 backdrop-blur-md flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl aurora-icon-frame overflow-hidden flex items-center justify-center shrink-0">
                    <img src="icon.png" alt="ChronoPlot" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden w-full h-full items-center justify-center text-white font-bold">CP</div>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-wider bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 dark:from-pink-300 dark:via-purple-300 dark:to-indigo-300 bg-clip-text text-transparent">ChronoPlot</h1>
                    <p class="text-[10px] text-slate-400 font-mono tracking-widest uppercase">Story Architecture Studio</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl border border-slate-200 dark:border-cyber-border bg-slate-100 dark:bg-cyber-card hover:border-purple-400 transition" title="ダーク/ライト切替">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-300"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-slate-600"></i>
                </button>
                <button onclick="openProjectModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white font-bold text-xs md:text-sm flex items-center gap-2 shadow-sm dark:shadow-neon-cyan hover:opacity-95 active:scale-95 transition">
                    <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    <span>新しい物語を作成</span>
                </button>
            </div>
        </header>

        <!-- プロジェクト一覧エリア -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 cyber-grid">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-base md:text-lg font-bold flex items-center gap-2">
                            <i data-lucide="folders" class="w-5 h-5 text-purple-400"></i>
                            <span>物語プロジェクト一覧</span>
                        </h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">フォルダを選択してプロット編集を開始します（自動保存対応）</p>
                    </div>
                    <span id="project-count" class="text-xs font-mono px-3 py-1 rounded-full bg-slate-200/80 dark:bg-cyber-card border border-slate-300 dark:border-cyber-border">0 PROJECTS</span>
                </div>

                <div id="project-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <!-- JSで描画 -->
                </div>
            </div>
        </main>
    </div>

    <!-- ==========================================
         WORKSPACE VIEW（メイン編集画面）
    =========================================== -->
    <div id="workspace-view" class="hidden h-screen w-screen flex flex-col overflow-hidden">
        <!-- トップバー -->
        <header class="h-14 px-3 md:px-4 border-b border-slate-200 dark:border-cyber-border bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md flex items-center justify-between gap-2 shrink-0 z-30">
            <div class="flex items-center gap-2 min-w-0">
                <button onclick="goHome()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-cyber-border bg-slate-100 dark:bg-cyber-card hover:border-purple-400 text-xs font-medium flex items-center gap-1.5 shrink-0 transition">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">ホーム</span>
                </button>

                <div class="w-7 h-7 rounded-lg aurora-icon-frame overflow-hidden shrink-0 hidden sm:flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'">
                </div>

                <!-- プロジェクトタイトル・メモ編集トリガー -->
                <button onclick="openProjectModal(currentProjectId)" class="flex items-center gap-2 px-2.5 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-cyber-card border border-transparent hover:border-slate-200 dark:hover:border-cyber-border transition min-w-0 text-left group" title="物語の名前・メモを編集">
                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-600 dark:text-purple-300 border border-purple-500/20 shrink-0">PROJECT</span>
                    <span id="workspace-title" class="font-bold text-xs md:text-sm truncate">無題の物語</span>
                    <i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400 group-hover:text-purple-400 shrink-0"></i>
                </button>
            </div>

            <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                <!-- テーマ切替 -->
                <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-cyber-border bg-slate-100 dark:bg-cyber-card hover:border-purple-400 transition" title="ダーク/ライト切替">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-300"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-slate-600"></i>
                </button>

                <!-- グラフ表示切替 -->
                <button id="btn-toggle-graph" onclick="toggleGraphPanel()" class="px-2.5 py-1.5 rounded-lg border border-pink-400/50 bg-pink-500/10 text-pink-600 dark:text-pink-300 text-xs font-bold flex items-center gap-1.5 transition">
                    <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                    <span class="hidden md:inline">感情グラフ</span>
                </button>
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <div class="flex-1 flex relative overflow-hidden">

            <!-- 左サイドバー（6カテゴリ） -->
            <aside class="w-14 md:w-16 border-r border-slate-200 dark:border-cyber-border bg-white/95 dark:bg-cyber-panel/95 flex flex-col items-center py-3 gap-2.5 z-30 shrink-0 overflow-y-auto">
                <button id="nav-template" onclick="toggleDrawer('template')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="簡易テンプレート (PSLOC)">
                    <i data-lucide="layout-template" class="w-4 h-4 text-emerald-500 dark:text-emerald-400"></i>
                    <span>テンプレ</span>
                </button>

                <button id="nav-stage" onclick="toggleDrawer('stage')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="舞台設定">
                    <i data-lucide="globe" class="w-4 h-4 text-indigo-500 dark:text-indigo-400"></i>
                    <span>舞台設定</span>
                </button>

                <button id="nav-characters" onclick="toggleDrawer('characters')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="キャラクター設定">
                    <i data-lucide="users" class="w-4 h-4 text-pink-500 dark:text-pink-400"></i>
                    <span>キャラ</span>
                </button>

                <button id="nav-notes" onclick="toggleDrawer('notes')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="付箋作成・フォルダ管理">
                    <i data-lucide="sticky-note" class="w-4 h-4 text-amber-500 dark:text-amber-300"></i>
                    <span>付箋作成</span>
                </button>

                <button id="nav-connect" onclick="toggleDrawer('connect')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="付箋つなぎ">
                    <i data-lucide="git-commit-horizontal" class="w-4 h-4 text-purple-500 dark:text-purple-400"></i>
                    <span>つなぎ</span>
                </button>

                <div class="w-8 h-[1px] bg-slate-200 dark:bg-cyber-border my-0.5 shrink-0"></div>

                <button id="nav-pdf" onclick="toggleDrawer('pdf')" class="sidebar-btn w-11 h-12 md:w-12 md:h-13 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold border border-transparent hover:bg-slate-100 dark:hover:bg-cyber-card transition shrink-0" title="PDF出力（単体・複数選択）">
                    <i data-lucide="file-down" class="w-4 h-4 text-rose-500 dark:text-rose-400"></i>
                    <span>PDF出力</span>
                </button>
            </aside>

            <!-- ドロワーパネル（スライド展開） -->
            <div id="drawer-panel" class="hidden w-80 md:w-96 max-w-[85vw] border-r border-slate-200 dark:border-cyber-border bg-white/95 dark:bg-cyber-panel/95 backdrop-blur-xl flex flex-col z-20 shadow-2xl shrink-0">
                <div class="h-12 px-4 border-b border-slate-200 dark:border-cyber-border flex items-center justify-between shrink-0">
                    <h3 id="drawer-title" class="font-bold text-sm flex items-center gap-2">設定</h3>
                    <button onclick="closeDrawer()" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-cyber-card text-slate-400 hover:text-slate-600 dark:hover:text-white transition">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="drawer-content" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- JSで動的描画 -->
                </div>
            </div>

            <!-- 右側メインエリア（白紙キャンバス ＋ 下部エモーショングラフ） -->
            <div class="flex-1 flex flex-col relative overflow-hidden">

                <!-- 白紙キャンバス領域 -->
                <div id="canvas-area" class="flex-1 relative overflow-hidden cyber-grid">

                    <!-- キャンバス上部コントロールバー -->
                    <div class="absolute top-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2 z-20 pointer-events-none">
                        <!-- 左側：操作モード ＋ Undo/Redo -->
                        <div class="flex flex-wrap items-center gap-1.5 pointer-events-auto">
                            <div class="flex items-center bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md p-1 rounded-xl border border-slate-200 dark:border-cyber-border shadow-md">
                                <button id="mode-move" onclick="setCanvasMode('move')" class="mode-btn px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                                    <i data-lucide="move" class="w-3.5 h-3.5"></i>
                                    <span>移動</span>
                                </button>
                                <button id="mode-select" onclick="setCanvasMode('select')" class="mode-btn px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                                    <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
                                    <span>複数選択</span>
                                </button>
                                <button onclick="clearSelection()" class="px-2 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-rose-500 transition" title="選択を全解除">
                                    解除
                                </button>
                            </div>

                            <!-- Undo / Redo -->
                            <div class="flex items-center bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md p-1 rounded-xl border border-slate-200 dark:border-cyber-border shadow-md">
                                <button id="btn-undo" onclick="undo()" class="px-2 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-100 dark:hover:bg-cyber-card disabled:opacity-30 flex items-center gap-1 transition" title="元に戻す (Ctrl+Z)">
                                    <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                                    <span class="hidden sm:inline">戻す</span>
                                </button>
                                <button id="btn-redo" onclick="redo()" class="px-2 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-100 dark:hover:bg-cyber-card disabled:opacity-30 flex items-center gap-1 transition" title="やり直す (Ctrl+Y)">
                                    <i data-lucide="redo-2" class="w-3.5 h-3.5"></i>
                                    <span class="hidden sm:inline">やり直し</span>
                                </button>
                            </div>
                        </div>

                        <!-- 右側：階層整列・ズーム・大きな視点リセット -->
                        <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
                            <button onclick="sortNotesByNumber()" class="px-3 py-2 rounded-xl bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md border border-slate-200 dark:border-cyber-border hover:border-purple-400 text-xs font-bold flex items-center gap-1.5 shadow-md transition" title="大筋を最上段、その下にキャラNo.順、左から番号順に整列">
                                <i data-lucide="arrow-down-narrow-wide" class="w-3.5 h-3.5 text-purple-400"></i>
                                <span>番号整列</span>
                            </button>

                            <div class="hidden sm:flex items-center bg-white/90 dark:bg-cyber-panel/90 backdrop-blur-md px-2 py-1 rounded-xl border border-slate-200 dark:border-cyber-border shadow-md text-xs font-mono">
                                <button onclick="zoomBy(-0.15)" class="p-1 hover:text-purple-400"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                                <span id="zoom-indicator" class="px-2">100%</span>
                                <button onclick="zoomBy(0.15)" class="p-1 hover:text-purple-400"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                            </div>

                            <!-- 大きくわかりやすい視点リセットボタン -->
                            <button onclick="resetViewport()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white font-bold text-xs md:text-sm flex items-center gap-1.5 shadow-md dark:shadow-neon-cyan hover:opacity-95 active:scale-95 transition">
                                <i data-lucide="crosshair" class="w-4 h-4"></i>
                                <span>視点リセット</span>
                            </button>
                        </div>
                    </div>

                    <!-- つなぎモード案内バナー -->
                    <div id="connect-banner" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-20 px-4 py-2 rounded-full bg-purple-600/95 text-white text-xs font-bold shadow-lg flex items-center gap-2">
                        <i data-lucide="git-commit-horizontal" class="w-4 h-4 animate-pulse"></i>
                        <span id="connect-banner-text">1枚目の付箋をタップしてください（同じ種類同士のみ接続可能）</span>
                        <button onclick="cancelConnectMode()" class="ml-1 px-2 py-0.5 rounded bg-white/20 hover:bg-white/30 text-[10px]">終了</button>
                    </div>

                    <!-- 無限拡張キャンバス（パン・ピンチズーム対象） -->
                    <div id="canvas-viewport" class="w-full h-full relative cursor-grab active:cursor-grabbing touch-none">
                        <div id="canvas-world" class="absolute top-0 left-0 origin-top-left" style="width: 6000px; height: 6000px;">
                            <!-- 接続線SVGレイヤー -->
                            <svg id="connections-svg" class="absolute inset-0 w-full h-full pointer-events-none" style="overflow: visible;"></svg>
                            <!-- 付箋カードレイヤー -->
                            <div id="notes-layer" class="absolute inset-0"></div>
                        </div>
                    </div>
                </div>

                <!-- 下部エモーションレベルグラフパネル -->
                <div id="graph-panel" class="h-56 md:h-64 border-t border-slate-200 dark:border-cyber-border bg-white/95 dark:bg-cyber-panel/95 backdrop-blur-md flex flex-col shrink-0 z-20 transition-all duration-300">
                    <div class="h-10 px-4 border-b border-slate-200 dark:border-cyber-border flex items-center justify-between gap-2 shrink-0">
                        <div class="flex items-center gap-2">
                            <i data-lucide="activity" class="w-4 h-4 text-pink-500"></i>
                            <span class="font-bold text-xs">エモーションレベル推移</span>
                        </div>

                        <div class="flex items-center gap-2">
                            <!-- 総合 / 単体 切替 -->
                            <div class="flex items-center bg-slate-100 dark:bg-cyber-card p-0.5 rounded-lg border border-slate-200 dark:border-cyber-border text-[11px]">
                                <button id="graph-mode-all" onclick="setGraphMode('all')" class="px-2.5 py-1 rounded-md font-bold transition">総合</button>
                                <button id="graph-mode-single" onclick="setGraphMode('single')" class="px-2.5 py-1 rounded-md font-bold transition">単体</button>
                            </div>

                            <!-- 単体対象セレクター -->
                            <select id="graph-target-select" onchange="renderEmotionGraph()" class="hidden text-xs px-2 py-1 rounded-lg bg-slate-100 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border font-medium">
                                <option value="outline">大筋</option>
                            </select>

                            <button onclick="toggleGraphPanel()" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-cyber-card text-slate-400" title="グラフを閉じる">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div id="graph-container" class="flex-1 relative p-2 overflow-hidden">
                        <!-- SVGグラフ描画 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         MODALS（プロジェクト作成・編集 / 付箋編集 / PSLOC解説）
    =========================================== -->
    <!-- プロジェクト新規作成・編集モーダル -->
    <div id="project-modal" class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-cyber-panel border border-slate-200 dark:border-cyber-border shadow-2xl p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="project-modal-title" class="font-bold text-base flex items-center gap-2">
                    <i data-lucide="folder-plus" class="w-5 h-5 text-purple-400"></i>
                    <span>新しい物語を作成</span>
                </h3>
                <button onclick="closeProjectModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <input type="hidden" id="edit-project-id">
            <div>
                <label class="block text-xs font-bold mb-1.5 text-slate-500 dark:text-slate-400">物語タイトル</label>
                <input id="input-project-title" type="text" placeholder="例：星屑のクロニクル" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm focus:outline-none focus:border-purple-400">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1.5 text-slate-500 dark:text-slate-400">概要・メモ</label>
                <textarea id="input-project-memo" rows="3" placeholder="ジャンルやあらすじメモ..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm focus:outline-none focus:border-purple-400"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeProjectModal()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-cyber-border text-xs font-bold">キャンセル</button>
                <button onclick="saveProjectModal()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white text-xs font-bold shadow-sm">保存する</button>
            </div>
        </div>
    </div>

    <!-- 付箋編集モーダル -->
    <div id="note-edit-modal" class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-cyber-panel border border-slate-200 dark:border-cyber-border shadow-2xl p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5 text-amber-400"></i>
                    <span>付箋の内容を編集</span>
                </h3>
                <button onclick="closeNoteEditModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <input type="hidden" id="edit-note-id">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1 text-slate-500 dark:text-slate-400">番号（時系列・順）</label>
                    <input id="edit-note-number" type="number" min="1" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-slate-500 dark:text-slate-400">対象</label>
                    <select id="edit-note-target" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm"></select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-slate-500 dark:text-slate-400">タイトル / 見出し</label>
                <input id="edit-note-title" type="text" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-slate-500 dark:text-slate-400">詳細メモ</label>
                <textarea id="edit-note-content" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-cyber-card border border-slate-200 dark:border-cyber-border text-sm"></textarea>
            </div>
            <div>
                <div class="flex justify-between text-xs font-bold mb-1">
                    <span class="text-slate-500 dark:text-slate-400">エモーションレベル</span>
                    <span id="edit-note-emotion-val" class="font-mono text-pink-500">0</span>
                </div>
                <input id="edit-note-emotion" type="range" min="-10" max="10" value="0" oninput="document.getElementById('edit-note-emotion-val').textContent = this.value" class="w-full accent-pink-500">
                <div class="flex justify-between text-[10px] text-slate-400 font-mono">
                    <span>-10 (絶望/下降)</span>
                    <span>0</span>
                    <span>+10 (高揚/頂点)</span>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeNoteEditModal()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-cyber-border text-xs font-bold">キャンセル</button>
                <button onclick="saveNoteEdit()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white text-xs font-bold">更新する</button>
            </div>
        </div>
    </div>

    <!-- PSLOC解説ポップアップ -->
    <div id="psloc-help-modal" class="hidden fixed inset-0 z-[110] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <div class="w-full max-w-sm rounded-2xl bg-white dark:bg-cyber-panel border border-purple-400/50 shadow-2xl p-5 space-y-3" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between">
                <h4 id="psloc-help-title" class="font-bold text-sm text-purple-500 dark:text-purple-300">解説</h4>
                <button onclick="document.getElementById('psloc-help-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <p id="psloc-help-body" class="text-xs leading-relaxed text-slate-600 dark:text-slate-300"></p>
        </div>
    </div>

    <!-- 印刷・PDF出力専用コンテナ（画面上は非表示、印刷・PDF変換時のみ表示） -->
    <div id="pdf-print-container" class="hidden"></div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
